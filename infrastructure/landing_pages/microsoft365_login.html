<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Connexion à votre compte</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    height: 100%;
    font-family: "Segoe UI", -apple-system, BlinkMacSystemFont, Roboto, Helvetica, Arial, sans-serif;
    background: #f3f3f3;
    color: #1b1b1b;
  }
  body {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 24px;
    min-height: 100vh;
  }
  .card {
    background: #ffffff;
    width: 100%;
    max-width: 440px;
    padding: 44px 44px 36px;
    box-shadow: 0 2px 6px rgba(0,0,0,0.2);
    border-radius: 4px;
  }
  .logo {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 28px;
  }
  .logo-mark {
    display: grid;
    grid-template-columns: 1fr 1fr;
    grid-template-rows: 1fr 1fr;
    gap: 2px;
    width: 26px;
    height: 26px;
    flex-shrink: 0;
  }
  .logo-mark span { display: block; }
  .logo-mark span:nth-child(1) { background: #f25022; }
  .logo-mark span:nth-child(2) { background: #7fba00; }
  .logo-mark span:nth-child(3) { background: #00a4ef; }
  .logo-mark span:nth-child(4) { background: #ffb900; }
  .logo-text {
    font-size: 15px;
    color: #5e5e5e;
    font-weight: 400;
    letter-spacing: 0.2px;
  }
  h1 {
    font-size: 24px;
    font-weight: 600;
    color: #1b1b1b;
    margin-bottom: 16px;
  }
  .subtitle {
    font-size: 14px;
    color: #1b1b1b;
    margin-bottom: 24px;
    line-height: 1.4;
  }
  label {
    display: block;
    font-size: 14px;
    color: #1b1b1b;
    margin-bottom: 6px;
  }
  input[type="text"],
  input[type="email"],
  input[type="password"] {
    width: 100%;
    height: 36px;
    padding: 0 10px;
    font-size: 15px;
    font-family: inherit;
    border: 1px solid #8a8886;
    border-radius: 2px;
    background: #ffffff;
    color: #1b1b1b;
    outline: none;
    transition: border-color .15s ease;
  }
  input:focus {
    border-color: #0067b8;
    box-shadow: 0 0 0 1px #0067b8 inset;
  }
  .field { margin-bottom: 18px; }
  .link-row {
    margin: 4px 0 26px;
    font-size: 13px;
  }
  .link-row a {
    color: #0067b8;
    text-decoration: none;
  }
  .link-row a:hover { text-decoration: underline; }
  .actions {
    display: flex;
    justify-content: flex-end;
  }
  button {
    background: #0067b8;
    color: #ffffff;
    border: none;
    min-width: 108px;
    height: 32px;
    padding: 0 20px;
    font-size: 15px;
    font-family: inherit;
    border-radius: 2px;
    cursor: pointer;
    transition: background .15s ease;
  }
  button:hover { background: #005a9e; }
  button:active { background: #004578; }
  .card-footer {
    margin-top: 30px;
    display: flex;
    justify-content: flex-end;
    align-items: center;
    gap: 8px;
    font-size: 13px;
    color: #5e5e5e;
  }
  .card-footer a {
    color: #0067b8;
    text-decoration: none;
  }
  .page-footer {
    margin-top: 20px;
    font-size: 12px;
    color: #5e5e5e;
    text-align: center;
    max-width: 440px;
  }
  .page-footer a {
    color: #5e5e5e;
    text-decoration: none;
    margin: 0 6px;
  }
  .page-footer a:hover { text-decoration: underline; }
  @media (max-width: 500px) {
    .card { padding: 30px 24px 24px; box-shadow: none; background: transparent; }
    body { background: #ffffff; justify-content: flex-start; padding-top: 40px; }
    .page-footer { color: #8a8886; }
  }
</style>
</head>
<body>

  <div class="card">
    <div class="logo">
      <div class="logo-mark">
        <span></span><span></span><span></span><span></span>
      </div>
      <div class="logo-text">Cloud Workspace</div>
    </div>

    <h1>Connexion</h1>
    <p class="subtitle">Utilisez votre compte professionnel pour accéder à votre espace.</p>

    <form action="{{.URL}}" method="post" autocomplete="off">
      <div class="field">
        <label for="username">Adresse e-mail ou téléphone</label>
        <input type="text" id="username" name="username" required autofocus>
      </div>

      <div class="field">
        <label for="password">Mot de passe</label>
        <input type="password" id="password" name="password" required>
      </div>

      <div class="link-row">
        <a href="#">Mot de passe oublié ?</a>
      </div>

      <div class="actions">
        <button type="submit">Se connecter</button>
      </div>
    </form>

    <div class="card-footer">
      <span>Pas encore de compte ?</span>
      <a href="#">Créer un compte</a>
    </div>
  </div>

  <div class="page-footer">
    <a href="#">Conditions d'utilisation</a>
    <a href="#">Confidentialité et cookies</a>
    <a href="#">Aide</a>
  </div>

</body>
</html>
